spring:
  cloud:
    consul:
      discovery:
        enabled: false
  mail:
    host: smtp.gmail.com
  kafka:
    bootstrap-servers: localhost:9092
    # En tests unitarios no hay broker (los IT usan @EmbeddedKafka): no fallar al arrancar.
    admin:
      fail-fast: false
    consumer:
      group-id: test-group
      # Los tests publican el evento apenas arranca el contexto, antes de que el
      # listener tenga asignada la partición: con earliest el evento no se pierde.
      auto-offset-reset: earliest
app:
  mail:
    fromchequera: fromchequera
    fromrecibo: fromrecibo
    fromnotificacion: fromnotificacion
    username: test
    password: test
  testing: true
