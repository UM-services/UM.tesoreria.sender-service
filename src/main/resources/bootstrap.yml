app:
  port: 0
  logging: debug
  testing: false
  # Topics de los que este servicio es dueño (KafkaTopicsConfiguration).
  kafka:
    topics:
      replicas: ${APP_KAFKA_TOPIC_REPLICAS:1}
      partitions: ${APP_KAFKA_TOPIC_PARTITIONS:1}
  consul:
    host: consul-service
    port: 8500
  mail:
    fromchequera: fromchequera
    fromrecibo: fromrecibo
    fromnotificacion: fromnotificacion
    host: host
    username: uid
    password: pwd

server:
  port: ${app.port}

spring:
  application:
    name: tesoreria-sender-service
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        instance-id: ${spring.application.name}-${spring.cloud.client.ip-address}-${server.port}
        prefer-ip-address: true
        # Solo resolver instancias con los checks en passing (Feign/LoadBalancer).
        query-passing: true
        # Consul: readiness (sin dependencias) + poda si queda critico.
        health-check-path: /actuator/health/readiness
        health-check-critical-timeout: 5m
        tags: tesoreria,sender
    openfeign:
      client:
        config:
          default:
            connectTimeout: 15000
            # Un solo llamado lento no puede comerse el max.poll.interval del lote.
            readTimeout: 60000
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    admin:
      fail-fast: true
      modify-topic-configs: true
    consumer:
      group-id: tesoreria-sender-group
      # latest: si el grupo no tiene offsets (nuevo o expirados) no se reenvían correos viejos.
      # Las factories de Kafka leen esta propiedad; los tests la sobreescriben a earliest.
      auto-offset-reset: latest
      # Lote chico + intervalo amplio: un lote de correos nunca supera el max.poll.interval.
      max-poll-records: ${APP_KAFKA_MAX_POLL_RECORDS:10}
      max-poll-interval-ms: ${APP_KAFKA_MAX_POLL_INTERVAL_MS:900000}
  mail:
    host: ${app.mail.host}
    port: 587
    username: ${app.mail.username}
    password: ${app.mail.password}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          connection timeout: 15000
          timeout: 15000
          write timeout: 15000

logging:
  um.tesoreria.report: ${app.logging}
  level:
    um.tesoreria.sender: ${app.logging}
    web: ${app.logging}
    org:
      hibernate:
        SQL: ${app.logging}
      springframework:
        amqp: ${app.logging}

management:
  health:
    mail:
      enabled: false
